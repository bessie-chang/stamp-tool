<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>證件限用章工具 (內部專用版)</title>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <style>
        :root {
            --primary: #4A6984;
            --line-green: #06C755;
            --bg: #f4f6f9;
            --card: #ffffff;
            --text: #333333;
        }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", sans-serif; }
        body {
            margin: 0; padding: 14px; background: var(--bg); color: var(--text);
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }
        .container {
            width: 100%; max-width: 540px; background: var(--card);
            border-radius: 16px; padding: 18px; box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }
        
        /* 登入畫面樣式 */
        .login-box {
            width: 100%; max-width: 380px; background: var(--card);
            border-radius: 16px; padding: 28px 22px; box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            margin-top: 10vh;
        }
        .login-box h2 { margin: 0 0 8px 0; font-size: 1.35rem; color: var(--primary); text-align: center; }
        .login-sub { text-align: center; font-size: 0.85rem; color: #666; margin-bottom: 20px; }
        .login-error {
            color: #d32f2f; background: #ffebee; padding: 8px 12px; border-radius: 8px;
            font-size: 0.85rem; text-align: center; margin-bottom: 12px; display: none;
        }
        .remember-row {
            display: flex; align-items: center; gap: 6px; font-size: 0.85rem; color: #555;
            margin-bottom: 16px; cursor: pointer;
        }
        .remember-row input { width: 16px; height: 16px; accent-color: var(--primary); }

        /* 主工具樣式 */
        h2 { margin: 0 0 6px 0; font-size: 1.3rem; color: var(--primary); text-align: center; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .logout-btn {
            background: none; border: 1px solid #ccc; color: #666; font-size: 0.75rem;
            padding: 3px 8px; border-radius: 12px; cursor: pointer;
        }
        .badge {
            display: block; text-align: center; font-size: 0.78rem; color: #2e7d32;
            background: #e8f5e9; padding: 4px 10px; border-radius: 20px; margin-bottom: 14px;
        }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 0.88rem; font-weight: 600; margin-bottom: 6px; }
        input[type="text"], input[type="password"] {
            width: 100%; padding: 11px 12px; border: 1.5px solid #d0d7de; border-radius: 10px;
            font-size: 1rem; outline: none; transition: border-color 0.2s;
        }
        input[type="text"]:focus, input[type="password"]:focus { border-color: var(--primary); }
        .quick-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
        .tag-btn {
            background: #eef3f7; color: var(--primary); border: 1px solid #cbd8e3;
            border-radius: 16px; padding: 4px 11px; font-size: 0.8rem; cursor: pointer;
        }
        .tag-btn:active { background: var(--primary); color: #fff; }
        .file-btn {
            display: block; width: 100%; padding: 13px; background: #eef3f7;
            border: 2px dashed var(--primary); border-radius: 12px; text-align: center;
            color: var(--primary); font-weight: bold; cursor: pointer; font-size: 0.98rem;
        }
        input[type="file"] { display: none; }
        .mode-row {
            display: flex; justify-content: space-between; align-items: center;
            gap: 10px; margin-bottom: 12px;
        }
        .toggle-group {
            display: flex; background: #e9ecef; border-radius: 10px; padding: 3px; flex: 1;
        }
        .toggle-btn {
            flex: 1; border: none; background: transparent; padding: 7px 0;
            border-radius: 8px; font-size: 0.85rem; font-weight: 600; color: #555; cursor: pointer;
        }
        .toggle-btn.active {
            background: #ffffff; color: var(--primary); box-shadow: 0 1px 4px rgba(0,0,0,0.12);
        }
        .color-presets { display: flex; align-items: center; gap: 6px; }
        .color-dot {
            width: 26px; height: 26px; border-radius: 50%; border: 2px solid #fff;
            box-shadow: 0 0 0 1.5px #ccc; cursor: pointer;
        }
        input[type="color"] { width: 28px; height: 28px; border: none; padding: 0; background: none; cursor: pointer; }
        .controls {
            display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;
            background: #f8fafc; padding: 10px; border-radius: 10px; margin-bottom: 14px;
        }
        .control-item label { font-size: 0.76rem; margin-bottom: 4px; color: #555; text-align: center; }
        input[type="range"] { width: 100%; accent-color: var(--primary); }
        .preview-box {
            width: 100%; min-height: 230px; background: #e9ecef; border-radius: 12px;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
            margin-bottom: 14px; position: relative; border: 1px solid #dee2e6;
        }
        canvas {
            max-width: 100%; max-height: 58vh; display: block;
            touch-action: none; cursor: grab;
        }
        canvas:active { cursor: grabbing; }
        .placeholder { color: #6c757d; font-size: 0.88rem; text-align: center; padding: 20px; line-height: 1.5; }
        .drag-hint {
            position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.55);
            color: #fff; font-size: 0.72rem; padding: 3px 8px; border-radius: 12px; pointer-events: none;
        }
        .download-btn {
            width: 100%; padding: 14px; background: var(--primary); color: white;
            border: none; border-radius: 12px; font-size: 1.02rem; font-weight: bold;
            cursor: pointer; box-shadow: 0 4px 12px rgba(74, 105, 132, 0.3);
            -webkit-appearance: none;
        }
        .download-btn:disabled { background: #adb5bd; box-shadow: none; cursor: not-allowed; }
        
        /* 成品圖彈窗 */
        .result-modal {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            z-index: 9999; flex-direction: column; align-items: center; justify-content: center; padding: 20px;
        }
        .result-modal img {
            max-width: 100%; max-height: 60vh; border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5); -webkit-touch-callout: default;
        }
        .result-tip {
            color: #ffeb3b; font-size: 0.92rem; font-weight: bold; margin-bottom: 12px; text-align: center;
        }
        .modal-actions {
            display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 320px; margin-top: 16px;
        }
        .share-line-btn {
            background: var(--line-green); color: #ffffff; border: none; padding: 13px 20px;
            border-radius: 24px; font-weight: bold; font-size: 1rem; cursor: pointer;
            box-shadow: 0 4px 12px rgba(6, 199, 85, 0.35);
        }
        .direct-save-btn {
            background: #2b7de9; color: #ffffff; border: none; padding: 12px 20px;
            border-radius: 24px; font-weight: bold; font-size: 0.96rem; cursor: pointer;
            box-shadow: 0 4px 12px rgba(43, 125, 233, 0.35);
        }
        .close-modal-btn {
            background: rgba(255,255,255,0.2); color: #ffffff; border: 1px solid rgba(255,255,255,0.4);
            padding: 10px 20px; border-radius: 24px; font-weight: bold; font-size: 0.92rem; cursor: pointer;
        }
    </style>
</head>
<body>

<!-- 登入驗證區塊 -->
<div class="login-box" id="loginView">
    <h2>🔒 證件限用章工具</h2>
    <div class="login-sub">內部專用系統，請輸入帳號與密碼</div>
    <div class="login-error" id="loginError">帳號或密碼錯誤，請重新輸入</div>
    <form id="loginForm">
        <div class="form-group">
            <label for="usernameInput">帳號</label>
            <input type="text" id="usernameInput" placeholder="請輸入帳號" autocomplete="username" required>
        </div>
        <div class="form-group">
            <label for="passwordInput">密碼</label>
            <input type="password" id="passwordInput" placeholder="請輸入密碼" autocomplete="current-password" required>
        </div>
        <label class="remember-row">
            <input type="checkbox" id="rememberMe" checked> 記住我的登入狀態（免重複輸入）
        </label>
        <button type="submit" class="download-btn">登入系統</button>
    </form>
</div>

<!-- 主工具區塊（預設隱藏，驗證通過才顯示） -->
<div class="container" id="appView" style="display:none;">
    <div class="header-bar">
        <span style="width:45px;"></span>
        <h2>🔏 證件限用章工具</h2>
        <button type="button" class="logout-btn" id="logoutBtn">登出</button>
    </div>
    <span class="badge">🛡️ 100% 離線本機運算・照片絕不上傳伺服器</span>

    <div class="form-group">
        <label for="purpose">1. 輸入用途（或點選下方常用標籤）</label>
        <input type="text" id="purpose" value="辦理門號" placeholder="請輸入用途...">
        <div class="quick-tags">
            <button type="button" class="tag-btn" onclick="setPurpose('辦理門號')">辦理門號</button>
            <button type="button" class="tag-btn" onclick="setPurpose('租務使用')">租務使用</button>
            <button type="button" class="tag-btn" onclick="setPurpose('銀行開戶')">銀行開戶</button>
            <button type="button" class="tag-btn" onclick="setPurpose('申請補助')">申請補助</button>
            <button type="button" class="tag-btn" onclick="setPurpose('保險理賠')">保險理賠</button>
        </div>
    </div>

    <div class="form-group">
        <label class="file-btn" for="fileInput">📂 2. 點此選擇照片或 PDF 檔案</label>
        <input type="file" id="fileInput" accept="image/*,application/pdf">
    </div>

    <div class="mode-row">
        <div class="toggle-group">
            <button type="button" class="toggle-btn active" id="btnVertical" onclick="setOrientation('vertical')">直式印章</button>
            <button type="button" class="toggle-btn" id="btnHorizontal" onclick="setOrientation('horizontal')">橫式印章</button>
        </div>
        <div class="color-presets">
            <div class="color-dot" style="background:#4A6984;" title="經典灰藍" onclick="setColor('#4A6984')"></div>
            <div class="color-dot" style="background:#C0392B;" title="印泥正紅" onclick="setColor('#C0392B')"></div>
            <div class="color-dot" style="background:#2C3E50;" title="公文深黑" onclick="setColor('#2C3E50')"></div>
            <input type="color" id="colorPicker" value="#4A6984" title="自訂顏色">
        </div>
    </div>

    <div class="controls">
        <div class="control-item">
            <label>大小 <span id="scaleVal">100</span>%</label>
            <input type="range" id="scaleRange" min="50" max="180" value="100">
        </div>
        <div class="control-item">
            <label>濃淡 <span id="alphaVal">65</span>%</label>
            <input type="range" id="alphaRange" min="20" max="95" value="65">
        </div>
        <div class="control-item">
            <label>角度 <span id="angleVal">-20</span>°</label>
            <input type="range" id="angleRange" min="-45" max="45" value="-20">
        </div>
    </div>

    <div class="preview-box" id="previewBox">
        <div class="placeholder" id="placeholderText">尚未選擇檔案<br>支援手機相簿照片及 PDF 文件</div>
        <canvas id="canvas" style="display:none;"></canvas>
        <div class="drag-hint" id="dragHint" style="display:none;">👆 可直接用手指或滑鼠拖曳印章</div>
    </div>

    <button type="button" class="download-btn" id="downloadBtn" disabled>💾 產生完成圖（存相簿 / 轉傳 LINE）</button>
</div>

<!-- 成品圖顯示層 -->
<div class="result-modal" id="resultModal">
    <div class="result-tip">👇 iPhone 可「長按圖片」存相簿，Android / 電腦可直接下載</div>
    <img id="resultImg" src="" alt="成品預覽">
    <div class="modal-actions">
        <button type="button" class="share-line-btn" id="shareLineBtn">📤 轉傳到 LINE / 系統分享</button>
        <button type="button" class="direct-save-btn" id="directSaveBtn">⬇️ 直接下載圖片 (Android / 電腦)</button>
        <button type="button" class="close-modal-btn" onclick="document.getElementById('resultModal').style.display='none'">關閉返回</button>
    </div>
</div>

<script>
    // ==========================================
    // ⚙️ 帳號與密碼設定區（請在此修改你要的帳密）
    // ==========================================
    const VALID_USER = "admin";
    const VALID_PASS = "8888";
    // ==========================================

    const loginView = document.getElementById('loginView');
    const appView = document.getElementById('appView');
    const loginForm = document.getElementById('loginForm');
    const loginError = document.getElementById('loginError');
    const AUTH_KEY = "stamp_tool_auth_v1";

    function showApp() {
        loginView.style.display = 'none';
        appView.style.display = 'block';
    }

    function showLogin() {
        appView.style.display = 'none';
        loginView.style.display = 'block';
    }

    // 檢查是否已記住登入狀態
    if (localStorage.getItem(AUTH_KEY) === "true" || sessionStorage.getItem(AUTH_KEY) === "true") {
        showApp();
    }

    loginForm.addEventListener('submit', e => {
        e.preventDefault();
        const u = document.getElementById('usernameInput').value.trim();
        const p = document.getElementById('passwordInput').value.trim();
        const remember = document.getElementById('rememberMe').checked;

        if (u === VALID_USER && p === VALID_PASS) {
            loginError.style.display = 'none';
            if (remember) {
                localStorage.setItem(AUTH_KEY, "true");
            } else {
                sessionStorage.setItem(AUTH_KEY, "true");
            }
            showApp();
        } else {
            loginError.style.display = 'block';
        }
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
        localStorage.removeItem(AUTH_KEY);
        sessionStorage.removeItem(AUTH_KEY);
        document.getElementById('passwordInput').value = '';
        showLogin();
    });

    // --- 以下為主工具邏輯 ---
    const purposeInput = document.getElementById('purpose');
    const fileInput = document.getElementById('fileInput');
    const scaleRange = document.getElementById('scaleRange');
    const alphaRange = document.getElementById('alphaRange');
    const angleRange = document.getElementById('angleRange');
    const colorPicker = document.getElementById('colorPicker');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const placeholderText = document.getElementById('placeholderText');
    const dragHint = document.getElementById('dragHint');
    const downloadBtn = document.getElementById('downloadBtn');
    const shareLineBtn = document.getElementById('shareLineBtn');
    const directSaveBtn = document.getElementById('directSaveBtn');

    let currentFile = null;
    let currentImage = null;
    let isPdf = false;
    let orientation = 'vertical';
    let stampOffset = { x: 0, y: 0 };
    let isDragging = false;
    let dragStart = { x: 0, y: 0 };
    let generatedDataUrl = "";
    let generatedFilename = "限用印章.jpg";

    function setPurpose(text) {
        purposeInput.value = text;
        if (currentImage) drawImageCanvas();
    }

    function setColor(hex) {
        colorPicker.value = hex;
        if (currentImage) drawImageCanvas();
    }

    function setOrientation(mode) {
        orientation = mode;
        document.getElementById('btnVertical').classList.toggle('active', mode === 'vertical');
        document.getElementById('btnHorizontal').classList.toggle('active', mode === 'horizontal');
        if (currentImage) drawImageCanvas();
    }

    [purposeInput, scaleRange, alphaRange, angleRange, colorPicker].forEach(el => {
        el.addEventListener('input', () => {
            document.getElementById('scaleVal').textContent = scaleRange.value;
            document.getElementById('alphaVal').textContent = alphaRange.value;
            document.getElementById('angleVal').textContent = angleRange.value;
            if (currentImage) drawImageCanvas();
        });
    });

    canvas.addEventListener('pointerdown', e => {
        e.preventDefault();
        isDragging = true;
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        dragStart = { x: e.clientX * scaleX - stampOffset.x, y: e.clientY * scaleY - stampOffset.y };
    });
    window.addEventListener('pointermove', e => {
        if (!isDragging || !currentImage) return;
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        stampOffset.x = e.clientX * scaleX - dragStart.x;
        stampOffset.y = e.clientY * scaleY - dragStart.y;
        drawImageCanvas();
    });
    window.addEventListener('pointerup', () => { isDragging = false; });

    fileInput.addEventListener('change', e => {
        const file = e.target.files[0];
        if (!file) return;
        currentFile = file;
        stampOffset = { x: 0, y: 0 };

        if (file.type === 'application/pdf') {
            isPdf = true;
            currentImage = null;
            canvas.style.display = 'none';
            dragHint.style.display = 'none';
            placeholderText.style.display = 'block';
            placeholderText.innerHTML = `📄 已載入 PDF：<b>${file.name}</b><br><br>將自動為每一頁中央蓋上限用章<br>請點擊下方按鈕產生檔案`;
            downloadBtn.textContent = "💾 下載加上限用章的 PDF";
            downloadBtn.disabled = false;
        } else {
            isPdf = false;
            const reader = new FileReader();
            reader.onload = ev => {
                const img = new Image();
                img.onload = () => {
                    currentImage = img;
                    placeholderText.style.display = 'none';
                    canvas.style.display = 'block';
                    dragHint.style.display = 'block';
                    downloadBtn.textContent = "💾 產生完成圖（存相簿 / 轉傳 LINE）";
                    downloadBtn.disabled = false;
                    drawImageCanvas();
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        }
    });

    function createStampCanvas(baseWidth) {
        const purpose = purposeInput.value.trim() || "指定";
        const topText = "本影本限";
        const bottomText = `${purpose}用途複印無效`;
        const scaleFactor = parseInt(scaleRange.value) / 100;
        const alpha = parseInt(alphaRange.value) / 100;
        const color = colorPicker.value;

        const fontSize = Math.max(24, Math.floor(baseWidth * 0.035 * scaleFactor));
        const padding = Math.floor(fontSize * 0.45);
        const fontStr = `bold ${fontSize}px "BiauKai", "DFKai-SB", "KaiTi", "STKaiti", serif`;

        const sCanvas = document.createElement('canvas');
        const sCtx = sCanvas.getContext('2d');
        sCtx.font = fontStr;

        if (orientation === 'vertical') {
            const charH = fontSize * 1.15;
            const totalChars = topText.length + bottomText.length;
            const stampW = Math.floor(fontSize * 1.6);
            const stampH = Math.floor(totalChars * charH + fontSize * 1.3 + padding * 2);

            sCanvas.width = stampW;
            sCanvas.height = stampH;

            sCtx.globalAlpha = alpha;
            sCtx.strokeStyle = color;
            sCtx.fillStyle = color;
            sCtx.lineWidth = Math.max(2, fontSize * 0.08);
            sCtx.strokeRect(1, 1, stampW - 2, stampH - 2);

            sCtx.font = fontStr;
            sCtx.textAlign = "center";
            sCtx.textBaseline = "top";

            let yCursor = padding;
            for (const char of topText) {
                sCtx.fillText(char, stampW / 2, yCursor);
                yCursor += charH;
            }
            yCursor += fontSize * 1.0;
            for (const char of bottomText) {
                sCtx.fillText(char, stampW / 2, yCursor);
                yCursor += charH;
            }
        } else {
            const line1 = topText;
            const line2 = bottomText;
            const textW = Math.max(sCtx.measureText(line1).width, sCtx.measureText(line2).width);
            const lineH = fontSize * 1.3;
            const stampW = Math.floor(textW + padding * 2.4);
            const stampH = Math.floor(lineH * 2 + padding * 1.8);

            sCanvas.width = stampW;
            sCanvas.height = stampH;

            sCtx.globalAlpha = alpha;
            sCtx.strokeStyle = color;
            sCtx.fillStyle = color;
            sCtx.lineWidth = Math.max(2, fontSize * 0.08);
            sCtx.strokeRect(1, 1, stampW - 2, stampH - 2);

            sCtx.font = fontStr;
            sCtx.textAlign = "center";
            sCtx.textBaseline = "middle";

            sCtx.fillText(line1, stampW / 2, padding * 0.9 + lineH * 0.5);
            sCtx.fillText(line2, stampW / 2, padding * 0.9 + lineH * 1.5);
        }

        return sCanvas;
    }

    function drawImageCanvas() {
        if (!currentImage) return;
        const maxDim = 2400;
        let w = currentImage.width;
        let h = currentImage.height;
        if (w > maxDim || h > maxDim) {
            if (w > h) {
                h = Math.round(h * (maxDim / w));
                w = maxDim;
            } else {
                w = Math.round(w * (maxDim / h));
                h = maxDim;
            }
        }
        canvas.width = w;
        canvas.height = h;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(currentImage, 0, 0, w, h);

        const stampCanvas = createStampCanvas(canvas.width);
        const angleRad = parseInt(angleRange.value) * Math.PI / 180;

        ctx.save();
        ctx.translate(canvas.width / 2 + stampOffset.x, canvas.height / 2 + stampOffset.y);
        ctx.rotate(angleRad);
        ctx.drawImage(stampCanvas, -stampCanvas.width / 2, -stampCanvas.height / 2);
        ctx.restore();
    }

    function dataURLtoFile(dataurl, filename) {
        const arr = dataurl.split(',');
        const mime = arr[0].match(/:(.*?);/)[1];
        const bstr = atob(arr[1]);
        let n = bstr.length;
        const u8arr = new Uint8Array(n);
        while (n--) {
            u8arr[n] = bstr.charCodeAt(n);
        }
        return new File([u8arr], filename, { type: mime });
    }

    shareLineBtn.addEventListener('click', async () => {
        if (!generatedDataUrl) return;
        try {
            const fileObj = dataURLtoFile(generatedDataUrl, generatedFilename);
            if (navigator.canShare && navigator.canShare({ files: [fileObj] })) {
                await navigator.share({
                    files: [fileObj],
                    title: generatedFilename
                });
            } else {
                alert("目前使用的瀏覽器（如 LINE 內建瀏覽器）不支援直接呼叫分享面板。\n\n請直接「長按上方圖片」存進相簿，或改用 Safari / Chrome 開啟此網頁即可直接轉傳 LINE！");
            }
        } catch (err) {
            if (err.name !== 'AbortError') {
                alert("無法開啟分享面板，請直接長按上方圖片儲存至相簿再傳送。");
            }
        }
    });

    directSaveBtn.addEventListener('click', () => {
        if (!generatedDataUrl) return;
        const a = document.createElement('a');
        a.href = generatedDataUrl;
        a.download = generatedFilename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    });

    downloadBtn.addEventListener('click', async () => {
        if (!currentFile) return;
        const origName = currentFile.name.replace(/\.[^/.]+$/, "");

        if (!isPdf) {
            try {
                generatedFilename = `限用印章_${origName}.jpg`;
                generatedDataUrl = canvas.toDataURL('image/jpeg', 0.92);
                document.getElementById('resultImg').src = generatedDataUrl;
                document.getElementById('resultModal').style.display = 'flex';
            } catch (err) {
                alert("圖片產生失敗：" + err.message);
            }
        } else {
            downloadBtn.disabled = true;
            downloadBtn.textContent = "⏳ 正在為 PDF 蓋章...";
            try {
                const arrayBuffer = await currentFile.arrayBuffer();
                const pdfDoc = await PDFLib.PDFDocument.load(arrayBuffer);
                const pages = pdfDoc.getPages();

                for (const page of pages) {
                    const { width, height } = page.getSize();
                    const stampCanvas = createStampCanvas(width * 2);
                    const pngDataUrl = stampCanvas.toDataURL('image/png');
                    const pngImage = await pdfDoc.embedPng(pngDataUrl);

                    const drawW = stampCanvas.width / 2;
                    const drawH = stampCanvas.height / 2;
                    const angleDeg = -parseInt(angleRange.value);
                    const rad = angleDeg * Math.PI / 180;

                    const cx = width / 2;
                    const cy = height / 2;
                    const x = cx - (drawW / 2) * Math.cos(rad) + (drawH / 2) * Math.sin(rad);
                    const y = cy - (drawW / 2) * Math.sin(rad) - (drawH / 2) * Math.cos(rad);

                    page.drawImage(pngImage, {
                        x: x, y: y, width: drawW, height: drawH,
                        rotate: PDFLib.degrees(angleDeg),
                    });
                }

                const pdfBytes = await pdfDoc.save();
                const filename = `限用印章_${origName}.pdf`;
                const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                const fileObj = new File([blob], filename, { type: 'application/pdf' });

                if (navigator.canShare && navigator.canShare({ files: [fileObj] })) {
                    try {
                        await navigator.share({ files: [fileObj], title: filename });
                        return;
                    } catch (err) {
                        if (err.name === 'AbortError') return;
                    }
                }

                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 5000);
            } catch (err) {
                alert("PDF 處理失敗：" + err.message);
            } finally {
                downloadBtn.disabled = false;
                downloadBtn.textContent = "💾 下載加上限用章的 PDF";
            }
        }
    });
</script>
